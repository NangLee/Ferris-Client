name: Build Ferris Client
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x86_64
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      FERRIS_UPDATE_PUBLIC_KEY: ${{ vars.FERRIS_UPDATE_PUBLIC_KEY }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the pinned public key
        shell: bash
        run: |
          if [[ -z "$FERRIS_UPDATE_PUBLIC_KEY" ]]; then
            [[ -f public-signing-key.txt ]] || { echo 'The committed public signing key is missing.' >&2; exit 1; }
            FERRIS_UPDATE_PUBLIC_KEY=$(tr -d '\r\n' < public-signing-key.txt)
            echo "FERRIS_UPDATE_PUBLIC_KEY=$FERRIS_UPDATE_PUBLIC_KEY" >> "$GITHUB_ENV"
          fi
          [[ -n "$FERRIS_UPDATE_PUBLIC_KEY" ]] || { echo 'The public signing key is empty.' >&2; exit 1; }
      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev libgtk-3-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev patchelf file desktop-file-utils python3 xz-utils
          cargo install cargo-packager --version 0.11.8 --locked
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Build Linux installers
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package.sh
      - name: Build generic Windows scene worker
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-worker.ps1
      - name: Build generic Linux scene worker
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build-worker.sh
      - name: Add portable Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/common.ps1
          $version = Get-FerrisVersion $env:GITHUB_WORKSPACE
          Compress-Archive -LiteralPath target/release/ferris-client.exe, README.md, THIRD_PARTY.md, LICENSE.md -DestinationPath "dist/ferris-client-$version-windows-x86_64-portable.zip"
      - name: Add portable Linux client and installer metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(item["version"] for item in json.load(sys.stdin)["packages"] if item["name"] == "ferris-client"))')
          tar -cJf "dist/ferris-client-$version-${{ matrix.platform }}-portable.tar.xz" -C target/release ferris-client -C "$GITHUB_WORKSPACE" README.md THIRD_PARTY.md LICENSE.md
          python3 - <<'PY'
          import hashlib, json, pathlib
          for path in pathlib.Path('dist').iterdir():
              if path.suffix.lower() not in ('.deb', '.appimage'):
                  continue
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              record = {'sha256': digest.hexdigest(), 'bytes': path.stat().st_size, 'archive': 'none', 'executable': path.name}
              pathlib.Path(str(path) + '.artifact.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Save client and generic worker artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferris-client-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
