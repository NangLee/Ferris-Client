[package]
name = "ferris-client"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Community render node for Ferris osu!taiko replay rendering"
authors = ["Ferris contributors"]
default-run = "ferris-client"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
ed25519-dalek = "2"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
keyring = { version = "3", features = ["windows-native", "linux-native-sync-persistent", "crypto-rust"] }
libc = "0.2"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
xz2 = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.packager]
product-name = "Ferris Client"
identifier = "win.ferrisfun.client"
category = "Utility"
publisher = "Ferris"
short-description = "Contribute your computer to the Ferris render queue"
before-packaging-command = "cargo build --release --locked"
out-dir = "dist"
icons = ["assets/icon.png"]
resources = ["THIRD_PARTY.md"]

[[package.metadata.packager.binaries]]
path = "ferris-client"
main = true
